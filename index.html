<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="Download the latest version of V4 Stream for Android.">
  <title>V4 Stream — Official App Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="screen">
    <header class="brand" aria-label="V4 Stream">
      <img class="app-logo" src="assets/logo.png" alt="V4 Stream app logo">
      <div class="brand-copy">
        <p class="eyebrow">OFFICIAL APP DOWNLOAD</p>
        <h1>V4 <span>Stream</span></h1>
      </div>
    </header>

    <section class="download-card" aria-labelledby="download-title">
      <div class="topline">
        <span class="status-dot"></span>
        <span>ANDROID APPLICATION</span>
        <span class="version">LATEST · v1.0.0</span>
      </div>
      <div class="hero-mark" aria-hidden="true">
        <div class="play-shape"></div>
      </div>
      <h2 id="download-title">Your stream.<br><span>One tap away.</span></h2>
      <p class="description">Download the latest version of V4 Stream and enjoy the experience on your Android device.</p>

      <a class="download-button" id="downloadButton" href="assets/app-release.apk" download="app-release.apk">
        <span class="button-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v3h16v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="button-label">DOWNLOAD APK</span>
        <span class="button-arrow" aria-hidden="true">↗</span>
      </a>
      <div class="download-meta">
        <span><i class="meta-icon">↓</i> <strong id="fileSize">APK file</strong></span>
        <span class="meta-separator"></span>
        <span><i class="meta-icon">◈</i> Android 5.0+</span>
      </div>
      <p class="download-status" id="downloadStatus" role="status" aria-live="polite">Secure download · Direct APK</p>
    </section>

    <footer class="footer">
      <span>© <span id="year"></span> V4 Stream</span>
      <span class="footer-divider">•</span>
      <span>Made for Android</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
